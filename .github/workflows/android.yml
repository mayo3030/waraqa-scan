name: Build Android app

# Every push to main builds a signed .apk and publishes it as a GitHub Release.
# The app's "Check for updates" button reads the newest release.
# Pushes to feature/* branches build a test .apk, published as a pre-release:
# the update button skips pre-releases, so testers install those by hand.
on:
  push:
    branches: [main, "feature/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 1.2.${{ github.run_number }}${{ github.ref_name != 'main' && '-test' || '' }}
      IS_TEST: ${{ github.ref_name != 'main' && 'yes' || '' }}
      # Optional: publish releases to a separate public repo (for a private source repo).
      # Set the repository variable RELEASES_REPO (owner/name) and the secret RELEASES_TOKEN.
      RELEASES_REPO: ${{ vars.RELEASES_REPO != '' && vars.RELEASES_REPO || github.repository }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install
        run: npm ci

      # No .apk is built or published unless the unit tests pass.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Make the test images
        run: |
          python -m pip install --quiet numpy pillow
          npm run fixtures

      - name: Run the unit tests
        run: npm test

      # Every screen and flow is clicked through in a browser before anything is published.
      - name: Run the end-to-end tests
        run: |
          npm run build:e2e
          npx playwright install --with-deps chromium
          npx playwright test

      - name: Keep the failure traces
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: e2e-failures
          path: test-results
          retention-days: 7

      - name: Build the web app
        run: npm run build
        env:
          VITE_GH_REPO: ${{ env.RELEASES_REPO }}
          APP_VERSION: ${{ env.VERSION_NAME }}

      - name: Copy it into the Android project
        run: npx cap sync android

      - name: Use the release key if one is set
        env:
          KEYSTORE_BASE64: ${{ secrets.WARAQA_KEYSTORE_BASE64 }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "WARAQA_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          echo "WARAQA_KEYSTORE_PASSWORD=${{ secrets.WARAQA_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
          echo "WARAQA_KEY_ALIAS=${{ secrets.WARAQA_KEY_ALIAS }}" >> "$GITHUB_ENV"
          echo "WARAQA_KEY_PASSWORD=${{ secrets.WARAQA_KEY_PASSWORD }}" >> "$GITHUB_ENV"

      - name: Build the .apk
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease -PappVersionCode=$VERSION_CODE -PappVersionName=$VERSION_NAME
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/waraqa-scan-$VERSION_NAME.apk"

      - uses: actions/upload-artifact@v5
        with:
          name: waraqa-scan-${{ env.VERSION_NAME }}
          path: waraqa-scan-${{ env.VERSION_NAME }}.apk

      - name: Publish the release
        env:
          GH_TOKEN: ${{ vars.RELEASES_REPO != '' && secrets.RELEASES_TOKEN || github.token }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          TARGET=""
          if [ "$RELEASES_REPO" = "${{ github.repository }}" ]; then TARGET="--target ${{ github.sha }}"; fi
          EXTRA=""
          TITLE="Waraqa Scan $VERSION_NAME"
          if [ -n "$IS_TEST" ]; then
            EXTRA="--prerelease"
            TITLE="Waraqa Scan $VERSION_NAME (test build from ${{ github.ref_name }})"
          fi
          gh release create "v$VERSION_NAME" "waraqa-scan-$VERSION_NAME.apk" \
            --repo "$RELEASES_REPO" $TARGET $EXTRA \
            --title "$TITLE" \
            --notes "${COMMIT_MSG:-New build}"

      # Optional: also put every new .apk in Google Drive.
      # Needs the secret RCLONE_CONF (an rclone config with a remote named "gdrive").
      # Folder name: repository variable DRIVE_FOLDER, default "Waraqa Scan Updates".
      - name: Upload to Google Drive
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
          DRIVE_FOLDER: ${{ vars.DRIVE_FOLDER != '' && vars.DRIVE_FOLDER || 'Waraqa Scan Updates' }}
        if: env.RCLONE_CONF != ''
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq rclone > /dev/null
          mkdir -p ~/.config/rclone
          printf '%s\n' "$RCLONE_CONF" > ~/.config/rclone/rclone.conf
          rclone copyto "waraqa-scan-$VERSION_NAME.apk" "gdrive:$DRIVE_FOLDER/waraqa-scan-$VERSION_NAME.apk"
          if [ -z "$IS_TEST" ]; then
            rclone copyto "waraqa-scan-$VERSION_NAME.apk" "gdrive:$DRIVE_FOLDER/waraqa-scan-latest.apk"
          fi
          rclone lsl "gdrive:$DRIVE_FOLDER" | tail -5
